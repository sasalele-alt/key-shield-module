# ==============================================================================
# 1. УСИЛЕНИЕ СИГНАЛА И СТАБИЛЬНОСТЬ СВЯЗИ
# ==============================================================================
# Установка максимальной мощности передатчика (+8 dBm)
# Помогает «пробить» помехи от портов USB 3.0 и корпуса стационарного ПК
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ==============================================================================
# 2. ИСПРАВЛЕНИЕ ОШИБОК ПОДКЛЮЧЕНИЯ WINDOWS (СОВМЕСТИМОСТЬ)
# ==============================================================================
# Включение стабильных интервалов опроса для Windows 10/11
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Исправление проблемы «Устройство подключено, но клавиши не печатают»
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Принудительное сопряжение в один клик (Just Works) без ввода цифровых кодов
# Это избавит от таймаутов сопряжения на ноутбуке
CONFIG_BT_SMP=n
CONFIG_BT_GATT_ENFORCE_SIGNING=n

# Оптимизация таймингов для старых адаптеров Bluetooth 4.0/4.2
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ==============================================================================
# 3. НАСТРОЙКА ПРОФИЛЕЙ И ИНДИКАЦИИ БАТАРЕИ
# ==============================================================================
# Выделение достаточного количества слотов под устройства (ПК, Ноутбук, Телефон)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Исправление отображения «0% заряда» в Windows
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ==============================================================================
# 4. УПРАВЛЕНИЕ ПИТАНИЕМ (ГЛУБОКИЙ СОН)
# ==============================================================================
# Включение режима глубокого сна для экономии аккумулятора
CONFIG_ZMK_SLEEP=y
# Время до ухода в сон — 15 минут (15 * 60 * 1000 мс)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
