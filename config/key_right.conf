# Явно указываем, что это правая беспроводная сторона
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Самый главный флаг, который заставит её слать правые координаты:
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL_RIGHT=y

# Повышенная мощность радио
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=n
