# Максимальное усиление сигнала (помогает пробить помехи ПК)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Обязательные параметры для стабильности Windows
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Принудительное сопряжение по стандарту Passkey/JustWorks для Windows
# CONFIG_BT_SMP=y

# Оптимизация интервалов опроса (убирает бесконечное сопряжение в Windows)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Защита от разрывов связи во время инициализации устройства ввода
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
