# Повышение мощности передатчика для стабильной связи через внешние адаптеры
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Включение экспериментальных настроек подключения для устранения проблем сопряжения в Windows
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Принудительное и корректное отображение уровня заряда батареи в ОС
CONFIG_ZMK_BATTERY_REPORTING=y
