# Максимальное усиление сигнала
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Принудительная генерация нового MAC-адреса
CONFIG_BT_PRIVACY=y

# Устранение ошибок HID-ввода в Windows
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Стандартные, более мягкие интервалы для капризных адаптеров
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Временное отключение отчетов о батарее (для чистоты теста)
CONFIG_ZMK_BATTERY_REPORTING=n
